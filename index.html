 if(tab==='Enhance')h=`<button class="pri" style="width:100%;margin-bottom:12px" data-ae="1">✨ One-tap auto enhance</button><h4>Smart correction</h4>${R('Auto levels','al',0,100)}${R('Auto white balance','wb',0,100)}${R('Clarity','cl',0,100)}${R('Vibrance','vb',0,100)}<h4>Manual color</h4>${R('Brightness','br',-50,50)}${R('Contrast','co',-50,60)}${R('Saturation','sa',-60,90)}${R('Sharpness','sp',0,100)}${R('Highlights','hi',-60,60)}${R('Shadows (lift)','sh',-60,60)}${R('Warmth','wa',-30,30)}`;
 if(tab==='Guides')h=`<div class="chips">${[[0,'Off'],[1,'Reel UI zones'],[2,'Grid 3:4 crop'],[3,'Both']].map(x=>chip('gm',x[0],x[1],S.gm===x[0])).join('')}</div><p class="note">Instagram Reels (Nov 2026): 1080 × 1920, 9:16. The profile grid shows the center 3:4 (1080 × 1440), so top and bottom 240 px are cropped there. In the Reels feed keep key text out of roughly the top 250 px, bottom 420 px and right 120 px. Guides show only in the preview, never in the saved image.</p>`;
 if(tab==='Export'){const cu=customs();h=`<h4>Export quality (${EDIM()})</h4><div class="chips">${[['std','Standard 1080'],['hd','HD 1620'],['ultra','Ultra 2160']].map(x=>chip('q',x[0],x[1],qual===x[0])).join('')}</div><div class="chips">${chip('fm','png','PNG (best)',fmt==='png')}${chip('fm','jpg','JPG (smaller)',fmt==='jpg')}</div><p class="note">Text, arrows and icons are vector, so they re-draw crisp at every size. If a phone runs out of memory on Ultra, it steps down automatically.</p><h4>Presets</h4><div class="chips">${Object.keys(PRE).map(n=>chip('pr',n,n)).join('')}</div><div class="chips">${Object.keys(cu).map(n=>chip('cu',n,n)+chip('del',n,'×')).join('')}</div><label class="f"><input type="text" id="pn" placeholder="Name this design"></label><button style="width:100%" data-sv="1">Save current design as preset</button>`}
 $('panel').innerHTML=h;thumbs();const f=$('file');if(f)f.onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{img=im;dirty=1;render()};im.src=URL.createObjectURL(fl)}}
function tabs(){if(tab==='Edit'&&sel<0)tab='Layers';$('qa').hidden=sel<0;{const lb=$('qa').querySelector('[data-op=lock]'),ll=S.layers[sel];lb.textContent=ll&&ll.lock?'Unlock':'Lock'}$('tabs').innerHTML=(sel>=0?['Edit']:[]).concat(['Text','Badges','Arrows','Icons','Photo','Look','Enhance','Layers','Guides','Export']).map(n=>chip('t',n,n,n===tab)).join('')}
$('tabs').onclick=e=>{const n=e.target.dataset.t;if(n){tab=n;tabs();panel()}};
function doOp(o){const i=sel,a=S.layers;if(i<0)return;if(a[i].lock&&['del','fw','bk'].includes(o))return;snap();if(o==='lock'){a[i].lock=a[i].lock?0:1}if(o==='dup'){const c=JSON.parse(JSON.stringify(a[i]));c.x+=4;c.y+=3;c.lock=0;a.push(c);sel=a.length-1}
 if(o==='del'){a.splice(i,1);sel=-1;tab='Layers'}if(o==='fw'&&i<a.length-1){[a[i],a[i+1]]=[a[i+1],a[i]];sel=i+1}if(o==='bk'&&i>0){[a[i],a[i-1]]=[a[i-1],a[i]];sel=i-1}if(o==='done'){sel=-1;tab='Layers'}tabs();panel();render()}
$('qa').onclick=e=>{const o=e.target.dataset.op;if(o)doOp(o)};
const P=$('panel');
P.addEventListener('input',e=>{const el=e.target,p=el.dataset.p;if(!p)return;const v=el.type==='range'?+el.value:el.value;sp(p,v);if(!p.startsWith('layers'))dirty=1;const b=P.querySelector(`[data-v="${p}"]`);if(b)b.textContent=v;if(p.endsWith('.font'))document.fonts.load(`${FONTS[v]} 100px "${v}"`).then(()=>render()).catch(()=>{});sched()});
P.addEventListener('focusin',e=>{if(e.target.dataset.p)snap()});
P.addEventListener('pointerdown',e=>{if(e.target.type==='range')snap()});
P.addEventListener('click',e=>{const d=e.target.closest('button');if(!d)return;const s=d.dataset;let ch=1;const add=l=>{snap();S.layers.push(l);sel=S.layers.length-1;tab='Edit';tabs()};
 if(s.add){const[t,k]=s.add.split(':');add(L(t,t==='arrow'?{st:k}:({burst:{k},circle:{k,fill:'#ffee00',sw:14,w:520,h:300},underline:{k,fill:'#ff2d2d',sw:22,w:600,h:120},label:{k,fill:'#e10600',stroke:'#ffffff',sw:6,w:520,h:150}})[k]))}
 else if(s.bd!==undefined)add(L('badge',{...BP[+s.bd][1]}));
 else if(s.ic)add(L('icon',{ic:s.ic,col:ICOL[s.ic]}));
 else if(s.ts!==undefined)add(L('text',+s.ts<0?{}:TS[+s.ts][1]));
 else if(s.lk!==undefined){snap();const x=S.layers[+s.lk];x.lock=x.lock?0:1;tabs()}
 else if(s.sel!==undefined){sel=+s.sel;tab='Edit';tabs()}
 else if(s.ast){snap();S.layers[sel].st=s.ast}
 else if(s.ics){snap();const x=S.layers[sel];x.ic=s.ics;x.col=ICOL[s.ics]}
 else if(s.cc){snap();const x=S.layers[sel];x[x.type==='arrow'||x.type==='icon'?'col':'fill']=s.cc}
 else if(s.ow){snap();S.layers[sel].ow=S.layers[sel].ow?0:1}
 else if(s.gm!==undefined)S.gm=+s.gm;
 else if(s.q){qual=s.q}else if(s.fm){fmt=s.fm}
 else if(s.ae){snap();Object.assign(S,{al:80,wb:50,cl:35,vb:35,sp:30,sh:15});dirty=1}
 else if(s.pr){snap();loadP(PRE[s.pr]());tabs()}
 else if(s.cu){snap();loadP(customs()[s.cu]);tabs()}
 else if(s.del){const c=customs();delete c[s.del];try{localStorage.setItem('rts3',JSON.stringify(c))}catch(x){}}
 else if(s.sv!==undefined){const n=$('pn').value.trim();if(!n)return;const c=customs(),bg={};Object.keys(BG).forEach(k=>bg[k]=S[k]);c[n]={bg,layers:JSON.parse(JSON.stringify(S.layers))};try{localStorage.setItem('rts3',JSON.stringify(c))}catch(x){}}
 else ch=0;
 if(ch){dirty=1;panel();render()}});
const restore=(from,to)=>{if(!from.length)return;to.push(JSON.stringify(S));S=JSON.parse(from.pop());sel=Math.min(sel,S.layers.length-1);dirty=1;tabs();panel();render();btns()};
const btns=()=>{$('undo').disabled=!hist.length;$('redo').disabled=!redo.length};
$('undo').onclick=()=>restore(hist,redo);$('redo').onclick=()=>restore(redo,hist);
const md=$('md');$('cl').onclick=()=>md.hidden=true;
$('save').onclick=async()=>{const b0=$('save');b0.textContent='Rendering…';await new Promise(r=>setTimeout(r,30));let blob=null;const mime=fmt==='jpg'?'image/jpeg':'image/png';
 for(const k of[2,1.5,1].filter(k=>k<=QK[qual])){try{setK(k);render(false);blob=await new Promise(r=>cv.toBlob(r,mime,.96));if(blob&&blob.size>3000)break}catch(e){blob=null}}
 setK(1);render();b0.textContent='Save';if(!blob)return;
 const f=new File([blob],'reel-cover.'+fmt,{type:mime});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 const u=URL.createObjectURL(blob);$('out').src=u;$('dl').href=u;$('dl').download='reel-cover.'+fmt;md.hidden=false};
tabs();panel();render();btns();
Promise.all(Object.keys(FONTS).map(f=>document.fonts.load(`${FONTS[f]} 100px "${f}"`))).then(()=>{render();thumbs()}).catch(()=>{});
</script></body></html>
